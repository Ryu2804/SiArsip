[project]
name = "siarsip-api"
version = "0.1.0"
description = "SiArsip backend: encrypted archive storage with FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # web
    "fastapi>=0.162.0",
    "granian[reload]>=2.8.5",
    "python-multipart>=0.0.17",
    "pydantic-settings>=2.6",
    # database
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # bucket
    "minio>=7.2",
    # crypto
    "cryptography>=44.0",
    "pycryptodome>=3.21",
    # stego
    "pillow>=11.0",
    "numpy>=2.1",
    # auth
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "pytest-cov>=7.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
