name: CI/CD Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Pytest
        working-directory: apps/api
        env:
          MASTER_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          DATABASE_URL: "postgresql://testuser:testpassword@localhost:5432/testdb"
          SECRET_KEY: "ci-secret-key-for-testing-only"
        run: |
          alembic upgrade head
          pytest tests/ -v
  deploy:
    name: Deploy to Vercel
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Migrations run against the production DB before the code that needs them
      # goes live (e.g. activity_logs.file_id ON DELETE SET NULL).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Guard - DATABASE_URL secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL is not set; aborting before deploy."
            exit 1
          fi

      - name: Run migrations (alembic upgrade head)
        working-directory: apps/api
        run: alembic upgrade head

      - name: Verify migrations are at head
        working-directory: apps/api
        run: |
          current=$(alembic current 2>/dev/null | awk '{print $1}' | head -n1)
          head=$(alembic heads 2>/dev/null | awk '{print $1}' | head -n1)
          echo "current=$current head=$head"
          if [ "$current" != "$head" ]; then
            echo "::error::Database is not at alembic head (current=$current, head=$head)"
            exit 1
          fi

      - name: Deploy to Vercel
        working-directory: apps/api
        run: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}